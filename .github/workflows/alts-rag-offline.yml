name: Alts RAG offline

on:
  push:
    paths:
      - "RAG/**"
      - ".github/workflows/alts-rag-offline.yml"
  pull_request:
    paths:
      - "RAG/**"
      - ".github/workflows/alts-rag-offline.yml"

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: RAG/src:.
      ALTS_RAG_RUNTIME: ${{ runner.temp }}/alts-rag-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned test packages
        run: python -m pip install pytest==8.4.2 numpy==2.4.6
      - name: Run offline RAG fixture tests
        run: python -B -m pytest -q RAG/tests -p no:cacheprovider
