[project]
name = "alts-rag"
version = "0.1.0"
description = "Offline source-search and field-assessment engine for the Alts ETL project."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2", "numpy==2.4.6"]
vectors = [
    "fastembed==0.8.0",
    "huggingface-hub==1.19.0",
    "numpy==2.4.6",
    "onnxruntime==1.27.0",
    "tokenizers==0.23.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
